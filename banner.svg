<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc">
  <title id="title">Pradyumn Prajapati - AI Full-Stack Engineer</title><desc id="desc">Animated dark developer profile banner.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#110b25"/><stop offset=".5" stop-color="#251044"/><stop offset="1" stop-color="#0d1835"/></linearGradient>
    <linearGradient id="name" x2="1"><stop stop-color="#f472b6"/><stop offset=".5" stop-color="#c084fc"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity=".05"/></pattern>
  </defs>
  <rect width="1280" height="500" rx="22" fill="url(#bg)"/><rect width="1280" height="500" rx="22" fill="url(#grid)"/>
  <circle cx="1080" cy="110" r="170" fill="#c084fc" opacity=".09"><animate attributeName="r" values="145;175;145" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="150" cy="440" r="130" fill="#22d3ee" opacity=".08"><animate attributeName="r" values="115;145;115" dur="5s" repeatCount="indefinite"/></circle>
  <g font-family="monospace" fill="#a5f3fc"><text x="78" y="83" font-size="19">technopradyumn@github:~$ cat README.md</text><rect x="480" y="66" width="10" height="22" fill="#f9a8d4"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect></g>
  <text x="76" y="173" font-family="Segoe UI,Arial,sans-serif" font-size="64" font-weight="800" fill="url(#name)" filter="url(#glow)">Pradyumn Prajapati</text>
  <text x="80" y="220" font-family="monospace" font-size="21" fill="#e9d5ff">AI Full-Stack Engineer <animate attributeName="opacity" values="0;1;1;0" dur="5s" repeatCount="indefinite"/></text>
  <text x="80" y="254" font-family="monospace" font-size="18" fill="#a5b4fc">Backend Development  •  Generative &amp; Agentic AI</text>
  <rect x="78" y="288" width="540" height="74" rx="12" fill="#0b1026" stroke="#8b5cf6" stroke-opacity=".55"/><text x="101" y="319" font-family="monospace" font-size="15" fill="#f0abfc">&gt; Building useful AI systems, one reliable API at a time.</text><text x="101" y="345" font-family="monospace" font-size="14" fill="#94a3b8">Delhi NCR  •  Open to meaningful engineering challenges</text>
  <g font-family="monospace" font-size="14"><rect x="80" y="394" width="93" height="31" rx="15" fill="#312e81"/><text x="96" y="415" fill="#ddd6fe">Python</text><rect x="184" y="394" width="93" height="31" rx="15" fill="#312e81"/><text x="200" y="415" fill="#ddd6fe">FastAPI</text><rect x="288" y="394" width="88" height="31" rx="15" fill="#312e81"/><text x="305" y="415" fill="#ddd6fe">RAG</text><rect x="387" y="394" width="100" height="31" rx="15" fill="#312e81"/><text x="405" y="415" fill="#ddd6fe">Docker</text></g>
  <g transform="translate(830 106)" font-family="monospace"><rect width="350" height="267" rx="16" fill="#0a1024" stroke="#67e8f9" stroke-opacity=".55"/><circle cx="25" cy="25" r="6" fill="#fb7185"/><circle cx="47" cy="25" r="6" fill="#fbbf24"/><circle cx="69" cy="25" r="6" fill="#4ade80"/><text x="25" y="77" fill="#c4b5fd" font-size="16">const buildDreams = () =&gt; {</text><text x="45" y="112" fill="#a5f3fc" font-size="16">learn();</text><text x="45" y="147" fill="#f9a8d4" font-size="16">ship();</text><text x="45" y="182" fill="#fef08a" font-size="16">improve();</text><text x="25" y="217" fill="#c4b5fd" font-size="16">};</text><text x="25" y="250" fill="#4ade80" font-size="13">// always in progress</text></g>
  <path d="M0 0H1280V500H0Z" fill="none" stroke="#f0abfc" stroke-width="3" opacity=".32"><animate attributeName="opacity" values=".1;.6;.1" dur="3.5s" repeatCount="indefinite"/></path>
</svg>
